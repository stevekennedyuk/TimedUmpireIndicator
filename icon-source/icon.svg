<?xml version="1.0" encoding="UTF-8"?>
<!--
  UmpireClicker app icon — scalable vector version.
  1024x1024 viewBox; matches make_icon.py layout (SAFE_INSET 110, GAP 80,
  dial radius 181, centres at 291 / 733).

  Note: text uses a bold sans-serif. For pixel-identical rendering across
  tools, convert the text elements to outlines before rasterising. Example
  tools that can do this: rsvg-convert, Inkscape, or cairosvg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024">
  <defs>
    <!-- Navy vertical gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#101C38"/>
      <stop offset="1"  stop-color="#081226"/>
    </linearGradient>

    <!-- Corner vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Ivory dial face with subtle bottom shading -->
    <linearGradient id="dialFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#F6F7F2"/>
      <stop offset="0.62" stop-color="#F4F5F0"/>
      <stop offset="1"    stop-color="#D6D8D1"/>
    </linearGradient>

    <!-- Reusable dial graphic (face, rims, ticks, pin) centred at 0,0 -->
    <g id="dial">
      <!-- outer chrome rim glow -->
      <circle r="197" fill="none" stroke="#D4DCE8" stroke-width="10"/>
      <!-- dial face -->
      <circle r="181" fill="url(#dialFace)" stroke="#3C4E6C" stroke-width="6"/>
      <!-- tick marks at 12, 3, 6, 9 o'clock -->
      <g stroke="#3C4E6C" stroke-width="5" stroke-linecap="round">
        <line x1="0"    y1="-163" x2="0"    y2="-143"/>
        <line x1="163"  y1="0"    x2="143"  y2="0"/>
        <line x1="0"    y1="163"  x2="0"    y2="143"/>
        <line x1="-163" y1="0"    x2="-143" y2="0"/>
      </g>
      <!-- tiny red indicator pin at the 12 o'clock slot -->
      <circle cx="0" cy="-159" r="14" fill="#BE3228" stroke="#781E19" stroke-width="2"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!-- faint horizontal divider through the middle -->
  <line x1="150" y1="512" x2="874" y2="512" stroke="#263454" stroke-width="4" opacity="0.9"/>

  <!-- ===== dials ===== -->
  <!-- BALLS = 2 (top-left) -->
  <use href="#dial" x="291" y="291"/>
  <text x="291" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="46" fill="#606E8A" letter-spacing="2">BALLS</text>
  <text x="291" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="210" fill="#182036">2</text>

  <!-- STRIKES = 1 (top-right) -->
  <use href="#dial" x="733" y="291"/>
  <text x="733" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="46" fill="#606E8A" letter-spacing="2">STRIKES</text>
  <text x="733" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="210" fill="#182036">1</text>

  <!-- OUTS = 2 (bottom-left) -->
  <use href="#dial" x="291" y="733"/>
  <text x="291" y="654" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="46" fill="#606E8A" letter-spacing="2">OUTS</text>
  <text x="291" y="814" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="210" fill="#182036">2</text>

  <!-- INNING = 3 (bottom-right) -->
  <use href="#dial" x="733" y="733"/>
  <text x="733" y="654" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="46" fill="#606E8A" letter-spacing="2">INNING</text>
  <text x="733" y="814" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-weight="700" font-size="210" fill="#182036">3</text>
</svg>
